name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      
      - name: Install dependencies
        run: |
          # Install OpenCV 4 (opencv@4) instead of opencv (latest = 5.x)
          # gocv v0.43.0 requires OpenCV 4.x
          brew install opencv@4 tesseract
      
      - name: Build
        run: |
          # Suppress deprecation warnings for NSSpeechSynthesizer
          # (macOS 14+ deprecated it in favor of AVSpeechSynthesizer, but we still support macOS 10.13+)
          export CGO_CFLAGS="-Wno-deprecated-declarations"
          # Set PKG_CONFIG_PATH for OpenCV 4 (Homebrew on Apple Silicon uses /opt/homebrew)
          export PKG_CONFIG_PATH="$(brew --prefix opencv@4)/lib/pkgconfig:$PKG_CONFIG_PATH"
          go build -o cardsense-gui cmd/gui/main.go
      
      - name: Test
        run: |
          go test ./pkg/...
      
      - name: Smoke test
        run: |
          ./cardsense-gui --help || echo "GUI binary exists"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardsense-macos
          path: cardsense-gui

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      
      - name: Restore cached OpenCV build
        uses: actions/cache/restore@v4
        id: cache-opencv-build
        with:
          key: opencv-build-4130-windows-cardsense-v1
          path: |
            C:\opencv\build
      
      - name: Clone gocv for build scripts
        if: steps.cache-opencv-build.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release https://github.com/hybridgroup/gocv.git C:\gocv-build
        shell: powershell
      
      - name: Download and build OpenCV
        if: steps.cache-opencv-build.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd C:\gocv-build && call win_download_opencv.cmd C:\opencv && call win_build_opencv.cmd C:\opencv
      
      - name: Save cached OpenCV build
        uses: actions/cache/save@v4
        if: steps.cache-opencv-build.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.cache-opencv-build.outputs.cache-primary-key }}
          path: |
            C:\opencv\build
      
      - name: Install Tesseract
        run: |
          choco install tesseract -y
        shell: powershell
      
      - name: Build
        run: |
          # Set CGO environment for OpenCV (built with MinGW)
          $env:CGO_CXXFLAGS = "--std=c++11"
          $env:CGO_CPPFLAGS = "-IC:\opencv\build\install\include"
          $env:CGO_LDFLAGS = "-LC:\opencv\build\install\x64\mingw\lib -lopencv_core4130 -lopencv_face4130 -lopencv_videoio4130 -lopencv_imgproc4130 -lopencv_highgui4130 -lopencv_imgcodecs4130 -lopencv_objdetect4130 -lopencv_features2d4130 -lopencv_video4130 -lopencv_dnn4130 -lopencv_xfeatures2d4130 -lopencv_plot4130 -lopencv_tracking4130 -lopencv_img_hash4130 -lopencv_calib3d4130"
          $env:PATH = "C:\opencv\build\install\x64\mingw\bin;$env:PATH"
          go build -tags customenv -o cardsense-gui.exe cmd/gui/main.go
        env:
          CGO_ENABLED: 1
        shell: powershell
      
      - name: Test
        run: |
          go test ./pkg/...
        shell: powershell
      
      - name: Smoke test
        run: |
          if (Test-Path cardsense-gui.exe) {
            Write-Output "✅ cardsense-gui.exe exists"
            $size = (Get-Item cardsense-gui.exe).Length / 1MB
            Write-Output "Size: $($size.ToString('F2')) MB"
          } else {
            Write-Error "❌ cardsense-gui.exe not found"
            exit 1
          }
        shell: powershell
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardsense-windows
          path: cardsense-gui.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
      
      - name: Display structure
        run: ls -R
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            cardsense-macos/cardsense-gui
            cardsense-windows/cardsense-gui.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
